<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="수업별 정리노트와 복습문제를 골라 바로 여는 아주 학습 자료실" />
  <title>아주 학습 자료실</title>
  <script id="theme-init">
    try {
      const theme = localStorage.getItem('od-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch { /* Storage may be unavailable; CSS follows the system theme. */ }
  </script>
    <link rel="stylesheet" href="/src/app/styles.css">
</head>
<body>
<div id="app">
  <a class="skip-link" id="skip-to-materials" href="#materials">자료 목록으로 건너뛰기</a>
  <header class="topnav">
    <div class="container topnav-inner">
      <a class="brand" href="#" id="brand-home" aria-label="아주 학습 자료실 처음으로"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="M4 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H4z"/><path d="M13 7a3 3 0 0 1 3-3h4v14h-4a4 4 0 0 0-3 3"/></svg><h1 class="logo">아주 학습 자료실</h1></a>
      <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="다크 모드로 전환" title="다크 모드로 전환">
        <svg class="icon i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="icon i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main id="content">
    <section class="search-region" aria-label="자료 검색과 과목 선택">
      <div class="container">
        <form role="search" id="search-form">
          <label class="sr-only" for="material-search">자료 검색</label>
          <div class="search-box">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" ><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
            <input class="search-input" id="material-search" type="search" placeholder="수업 주제나 자료 검색" autocomplete="off" maxlength="160" aria-controls="material-list" />
            <button class="icon-button" id="clear-search" type="button" aria-label="검색어 지우기" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="m6 6 12 12M6 18 18 6"/></svg></button>
            <kbd class="shortcut" id="search-shortcut" aria-label="슬래시 키로 검색">/</kbd>
          </div>
        </form>
        <nav class="course-filters" id="course-filters" aria-label="과목 필터"></nav>
      </div>
    </section>
    <section class="recent-region" id="recent-region" aria-labelledby="recent-heading" hidden>
      <div class="container"><div class="recent-box"><h2 id="recent-heading">최근 열어본 자료</h2><div id="recent-link"></div></div></div>
    </section>
    <section class="section catalog-section" id="materials" tabindex="-1" aria-labelledby="list-heading">
      <div class="container">
        <div class="catalog-toolbar">
          <div class="list-heading"><div><h2 id="list-heading">모든 수업</h2><small id="course-repository" hidden></small></div></div>
          <div class="list-options">
            <label class="select-wrap"><span class="sr-only">자료 유형</span><select class="select-control" id="type-filter" aria-controls="material-list"><option value="all">모든 자료</option><option value="note">정리노트</option><option value="review">복습문제</option><option value="check">확인문제</option><option value="explanation">문제설명</option><option value="interactive">인터랙티브</option><option value="comic">학습만화</option><option value="other">기타 자료</option></select><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="m7 10 5 5 5-5"/></svg></label>
            <label class="select-wrap"><span class="sr-only">수업 정렬</span><select class="select-control" id="sort-order" aria-controls="material-list"><option value="recent">최근 수업순</option><option value="oldest">이전 수업순</option></select><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="m7 10 5 5 5-5"/></svg></label>
          </div>
        </div>
        <p class="sr-only" id="results-announcement" role="status" aria-live="polite" aria-atomic="true"></p>
        <div id="material-list"></div>
        <p id="catalog-status" role="status" hidden></p>
        <div class="empty-state" id="catalog-error" role="alert" hidden>
          <h3 id="catalog-error-heading">자료 목록을 불러오지 못했습니다</h3>
          <p>페이지를 새로고침해 다시 시도해 주세요.</p>
          <button type="button" class="btn btn-secondary" id="retry-catalog">다시 시도</button>
        </div>
        <div class="empty-state" id="empty-state" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" ><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><h3 id="empty-heading">찾는 자료가 없어요</h3>
          <p id="empty-description">검색어를 줄이거나 과목·자료 유형을 바꿔보세요.</p>
          <button type="button" class="btn btn-secondary" id="reset-filters">검색 조건 초기화</button>
        </div>
        <div class="list-bottom" id="list-bottom">
          <button type="button" class="btn btn-secondary load-more" id="load-more">수업 더 보기 <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" ><path d="m7 10 5 5 5-5"/></svg></button>
        </div>
      </div>
    </section>
  </main>
  <noscript><p class="container" style="padding-block:24px">검색과 자료 열기를 사용하려면 브라우저에서 JavaScript를 켜주세요.</p></noscript>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
