name: Verify and publish study updates
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Default follows the reviewed enable variable; verify forces verification only
        type: choice
        options: [default, verify]
        default: default
      source_repository:
        description: Optional source repository notification
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: study-hub-production
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'jjundev/ajou-study-hub' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'jjundev/ajou-study-hub/.github/workflows/study-hub-update.yml@refs/heads/main' &&
      github.workflow_sha == github.sha &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Validate dispatch before privileged work
        id: guard
        working-directory: ${{ github.workspace }}
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          node <<'NODE'
          const allowed=['','jjundev/ajou-nonhoesil','jjundev/ajou-life-science','jjundev/ajou-electronic-circuits-2','jjundev/ajou-jagual','jjundev/ajou-ml-basics'];
          if(!['','default','verify'].includes(process.env.MODE??'')||!allowed.includes(process.env.SOURCE_REPOSITORY??'')){console.error('CI_INPUT_REJECTED');process.exitCode=1;}
          NODE
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Checkout trusted app SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-study-hub
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - name: Prepare isolated Git configuration before Reader or source checkout
        id: source-git
        run: node tools/ci/source-git-environment.ts
      - name: Record trusted checkout before executing dependencies
        run: node tools/ci/process-boundary.ts capture "$RUNNER_TEMP/study-hub-trusted.json"
      - name: Probe platform process metadata before Reader or dependencies
        id: process-probe
        run: node tools/ci/process-boundary.ts probe-processes "$RUNNER_TEMP/study-hub-trusted.json"
      - name: Load pinned resolver without lifecycle scripts or Reader credentials
        run: npm ci --ignore-scripts --no-audit --no-fund > /dev/null 2>&1 || { echo CI_RESOLVER_INSTALL_FAILED; exit 1; }
      - name: Derive exact sparse selections from trusted course configuration
        id: sparse
        run: node --import tsx tools/ci/sparse-source.ts
      - name: Prove sparse Git selection with synthetic local repositories before Reader
        id: sparse-probe
        run: npx vitest run tests/ci/sparse-source.test.ts tests/ci/source-limits.test.ts tests/ci/source-git-environment.test.ts --maxWorkers=1 > /dev/null 2>&1 || { echo CI_SPARSE_PROBE_FAILED; exit 1; }
      - name: Create source-only Reader token
        id: reader
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.STUDY_HUB_READER_APP_ID }}
          private-key: ${{ secrets.STUDY_HUB_READER_PRIVATE_KEY }}
          owner: jjundev
          repositories: ajou-nonhoesil,ajou-life-science,ajou-electronic-circuits-2,ajou-jagual,ajou-ml-basics
          permission-contents: read
      - name: Resolve all five main revisions once
        id: revisions
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          mkdir -p .local
          node --import tsx tools/ci/sources-cli.ts resolve > .local/revisions.json
          node --input-type=module <<'NODE'
          import {readFile,writeFile,appendFile} from 'node:fs/promises';
          const revisions=JSON.parse(await readFile('.local/revisions.json','utf8'));
          for(const revision of revisions){revision.root='../sources/'+revision.courseId;await appendFile(process.env.GITHUB_OUTPUT,revision.courseId.replaceAll('-','_')+'='+revision.sha+'\n');}
          await writeFile('.local/revisions.json',JSON.stringify(revisions));
          NODE
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-nonhoesil
          ref: ${{ steps.revisions.outputs.logic_lab }}
          token: ${{ steps.reader.outputs.token }}
          path: sources/logic-lab
          sparse-checkout: ${{ steps.sparse.outputs.logic_lab }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-life-science
          ref: ${{ steps.revisions.outputs.life_science }}
          token: ${{ steps.reader.outputs.token }}
          path: sources/life-science
          sparse-checkout: ${{ steps.sparse.outputs.life_science }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-electronic-circuits-2
          ref: ${{ steps.revisions.outputs.circuits_2 }}
          token: ${{ steps.reader.outputs.token }}
          path: sources/circuits-2
          sparse-checkout: ${{ steps.sparse.outputs.circuits_2 }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-jagual
          ref: ${{ steps.revisions.outputs.data_structures }}
          token: ${{ steps.reader.outputs.token }}
          path: sources/data-structures
          sparse-checkout: ${{ steps.sparse.outputs.data_structures }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-ml-basics
          ref: ${{ steps.revisions.outputs.ml_basics }}
          token: ${{ steps.reader.outputs.token }}
          path: sources/ml-basics
          sparse-checkout: ${{ steps.sparse.outputs.ml_basics }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - name: Hydrate status metadata while scoped Reader is available
        id: hydrate-source-status
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: node --import tsx tools/ci/hydrate-source-status.ts
      - name: Revoke Reader before any browser or material execution
        id: revoke-reader
        if: ${{ always() && steps.reader.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          node <<'NODE'
          (async()=>{
            const response=await fetch('https://api.github.com/installation/token',{method:'DELETE',redirect:'error',signal:AbortSignal.timeout(30000),headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            if(response.status!==204||response.redirected)throw Error();
          })().catch(()=>{console.error('CI_READER_REVOCATION_FAILED');process.exitCode=1;});
          NODE
      - name: Bound source paths, sizes, and free space before material reads
        id: source-limits
        run: |
          node --import tsx tools/ci/source-limits.ts
          node --import tsx tools/ci/sources-cli.ts bind "$GITHUB_SHA" .local/revisions.json > /dev/null || { echo CI_BIND_FAILED; exit 1; }
      - name: Fingerprint the pinned public inputs
        id: fingerprint-public-inputs
        if: >-
          ${{ vars.STUDY_HUB_AUTOMATIC_UPDATES == 'enabled' && inputs.mode != 'verify' &&
              (vars.STUDY_HUB_UNCHANGED_DEPLOYMENTS == 'observe' || vars.STUDY_HUB_UNCHANGED_DEPLOYMENTS == 'skip' ||
               vars.STUDY_HUB_COURSE_VERIFICATION == 'observe' || vars.STUDY_HUB_COURSE_VERIFICATION == 'apply' ||
               vars.STUDY_HUB_DOCUMENT_TRANSFORM_REUSE == 'observe') }}
        continue-on-error: true
        env:
          UNCHANGED_DEPLOYMENTS: ${{ vars.STUDY_HUB_UNCHANGED_DEPLOYMENTS }}
        run: |
          fingerprint="$RUNNER_TEMP/study-hub-public-input.json"
          (umask 077; set -o noclobber; node --import tsx tools/ci/public-input-fingerprint.ts > "$fingerprint")
          hash="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).inputHash' "$fingerprint")"
          if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then echo CI_PUBLIC_INPUT_UNAVAILABLE; exit 1; fi
          printf 'input_hash=%s\n' "$hash" >> "$GITHUB_OUTPUT"
          if [[ "$UNCHANGED_DEPLOYMENTS" == observe || "$UNCHANGED_DEPLOYMENTS" == skip ]]; then
            printf 'policy=%s\n' "$UNCHANGED_DEPLOYMENTS" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare with the active verified public deployment
        id: compare-public-inputs
        if: >-
          ${{ github.event_name == 'workflow_dispatch' && inputs.source_repository != '' &&
              steps.fingerprint-public-inputs.outcome == 'success' &&
              steps.fingerprint-public-inputs.outputs.input_hash != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          COURSE_VERIFICATION: ${{ vars.STUDY_HUB_COURSE_VERIFICATION }}
          DOCUMENT_TRANSFORM_REUSE: ${{ vars.STUDY_HUB_DOCUMENT_TRANSFORM_REUSE }}
          STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS: ${{ vars.STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS }}
        run: node --import tsx tools/ci/public-deployment-checkpoint.ts compare
      - name: Skip a verified unchanged course deployment
        id: skip-public-deployment
        if: >-
          ${{ success() && steps.fingerprint-public-inputs.outputs.policy == 'skip' &&
              steps.compare-public-inputs.outcome == 'success' && steps.compare-public-inputs.outputs.match == 'true' }}
        run: echo 'skip=true' >> "$GITHUB_OUTPUT"
      - name: Install trusted application dependencies
        if: ${{ steps.skip-public-deployment.outputs.skip != 'true' }}
        run: npm ci --no-audit --no-fund > /dev/null 2>&1 || { echo CI_INSTALL_FAILED; exit 1; }
      - name: Install three browsers
        id: browsers
        if: ${{ steps.skip-public-deployment.outputs.skip != 'true' }}
        run: npx playwright install --with-deps chromium firefox webkit > /dev/null 2>&1 || { echo CI_BROWSER_INSTALL_FAILED; exit 1; }
      - name: Typecheck and synthetic tests
        if: ${{ steps.skip-public-deployment.outputs.skip != 'true' }}
        run: |
          npm run typecheck > /dev/null 2>&1 || { echo CI_TYPECHECK_FAILED; exit 1; }
          npm test -- --maxWorkers=1 > /dev/null 2>&1 || { echo CI_UNIT_FAILED; exit 1; }
          # Default app commands generate synthetic fixtures; no --sources or cloud credentials here.
          npm run test:e2e -- --reporter=line || { echo CI_E2E_FAILED; exit 1; }
      - name: Probe process metadata after synthetic browsers before material build
        id: post-test-process-probe
        if: ${{ steps.skip-public-deployment.outputs.skip != 'true' }}
        run: node tools/ci/process-boundary.ts probe-processes "$RUNNER_TEMP/study-hub-trusted.json"
      - name: Build and verify the same pinned material checkout
        id: material
        if: ${{ steps.skip-public-deployment.outputs.skip != 'true' }}
        env:
          COURSE_RELEASE: ${{ steps.compare-public-inputs.outcome == 'success' && steps.compare-public-inputs.outputs.course_release || '' }}
          RECORD_DOCUMENT_TRANSFORMS: ${{ vars.STUDY_HUB_AUTOMATIC_UPDATES == 'enabled' && inputs.mode != 'verify' && vars.STUDY_HUB_DOCUMENT_TRANSFORM_REUSE == 'observe' }}
        run: |
          build_started_at="$(date +%s%3N)"
          npm run build -- --sources .local/ci-sources.json > /dev/null 2>&1 || { echo CI_BUILD_FAILED; exit 1; }
          printf 'build_started_at=%s\nbuild_finished_at=%s\n' "$build_started_at" "$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          verify_material() {
            node --import tsx tools/ci/verify-material.ts
          }
          if ! verify_material; then
            if node --input-type=module <<'RETRY'
          import {readFile} from 'node:fs/promises';
          try {
            const report=JSON.parse(await readFile('.reports/verification.json','utf8'));
            const errors=report.issues.filter(issue=>issue.severity==='error');
            const mayRetry=report.status==='complete' && report.representatives.complete &&
              errors.length===1 && errors.every(({code,reason})=>
                code==='runtime-external-representative-requestfailed' &&
                /^(?:net::ERR_ABORTED|NS_BINDING_ABORTED|Cancelled|cancelled)$/.test(reason));
            process.exitCode=mayRetry?0:1;
          } catch { process.exitCode=1; }
          RETRY
            then
              echo CI_RETRY_AFTER_EXTERNAL_REQUEST_CANCELLED
              if verify_material; then exit 0; fi
            fi
            node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          try {
            const report=JSON.parse(await readFile('.reports/verification.json','utf8'));
            const errors=report.issues.filter(issue=>issue.severity==='error');
            const allowed=/^runtime-(?:original|copy|external)-(?:http|requestfailed|pageerror|navigation|image|unsettled-request|font-fallback-content|representative-[a-z]+)$/;
            const codes=[...new Set(errors.map(issue=>allowed.test(issue.code)?issue.code:'other'))];
            const causes=[...new Set(errors.map(({reason})=>{
              if (/^(?:net::ERR_ABORTED|NS_BINDING_ABORTED|Cancelled|cancelled)$/.test(reason)) return 'request-cancelled';
              if (/^(?:net::ERR_BLOCKED_BY_ORB|net::ERR_BLOCKED_BY_RESPONSE)$/.test(reason)) return 'blocked-response';
              if (/^(?:net::ERR_(?:CONNECTION_[A-Z_]+|NAME_NOT_RESOLVED|TIMED_OUT|CERT_[A-Z_]+)|NS_ERROR_[A-Z_]+)$/.test(reason)) return 'network';
              return 'other';
            }))];
            const reviewErrors=new Set(['REVIEW_PDF_GROUP_UNAVAILABLE','REVIEW_PDF_MISSING','ANSWER_PDF_MISSING',
              'REVIEW_PDF_INVALID_ASSET','REVIEW_PDF_BYTES_MISMATCH','REVIEW_PDF_DOWNLOAD_FAILED']);
            const scenarios=report.representatives.scenarios
              .filter(row=>row.passed===false && ['chromium','firefox','webkit'].includes(row.browser) && [390,1440].includes(row.width))
              .map(({browser,width,caseId,error})=>caseId==='logic-lab-experiment-01-downloads' && reviewErrors.has(error)
                ? {browser,width,caseId,error} : {browser,width});
            console.error(JSON.stringify({code:'CI_CONTENT_FAILED',errors:errors.length,kinds:codes,causes,scenarios}));
          } catch { console.error('CI_CONTENT_FAILED: verification report unavailable'); }
          NODE
            exit 1
          fi
      - name: Compare the observed match with the actual built bundle
        if: >-
          ${{ steps.fingerprint-public-inputs.outputs.policy == 'observe' &&
              steps.compare-public-inputs.outcome == 'success' && steps.compare-public-inputs.outputs.match == 'true' }}
        continue-on-error: true
        env:
          PREVIOUS_BUNDLE_HASH: ${{ steps.compare-public-inputs.outputs.bundle_hash }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';
          let summary = '게시 입력 일치 · 빌드 번들 확인 불가';
          try {
            const { bundleHash } = JSON.parse(await readFile('.reports/app-build.json', 'utf8'));
            if (typeof bundleHash !== 'string' || !/^[a-f0-9]{64}$/.test(bundleHash)) throw Error();
            summary = bundleHash === process.env.PREVIOUS_BUNDLE_HASH
              ? '게시 입력 일치 · 빌드 번들 일치'
              : '게시 입력 일치 · 빌드 번들 불일치';
          } catch {}
          await appendFile(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          NODE
      - name: Detect surviving processes and trusted checkout changes
        id: boundary
        run: |
          node tools/ci/process-boundary.ts check "$RUNNER_TEMP/study-hub-trusted.json"
          node --input-type=module <<'NODE'
          import {readdir,realpath} from 'node:fs/promises';
          import {resolve} from 'node:path';
          import {credentialConfigurationFingerprint} from './tools/ci/process-boundary.ts';
          try {
            for(const entry of await readdir('../sources',{withFileTypes:true})){
              const path=resolve('../sources',entry.name);
              if(!entry.isDirectory()||entry.isSymbolicLink()||await realpath(path)!==path)throw Error();
              await credentialConfigurationFingerprint(path);
            }
          } catch {console.error('BOUNDARY_SOURCE_CREDENTIAL_CONFIG');process.exitCode=1;}
          NODE
      - name: Report the verified unchanged deployment
        if: ${{ steps.skip-public-deployment.outputs.skip == 'true' && steps.boundary.outcome == 'success' }}
        run: echo '게시 입력 동일 · 기존 운영 버전 확인' >> "$GITHUB_STEP_SUMMARY"
      - name: Emit bounded metadata only
        if: ${{ steps.skip-public-deployment.outputs.skip != 'true' }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const rows=JSON.parse(await readFile('.local/revisions.json','utf8'));
          const courseIds=['logic-lab','life-science','circuits-2','data-structures','ml-basics'];
          if(!Array.isArray(rows)||rows.length!==courseIds.length)throw Error('CI_SUMMARY_REJECTED');
          const sourceShas=Object.fromEntries(courseIds.map(courseId=>{
            const matches=rows.filter(row=>row?.courseId===courseId);
            if(matches.length!==1||typeof matches[0].sha!=='string'||!/^[a-f0-9]{40}$/.test(matches[0].sha))throw Error('CI_SUMMARY_REJECTED');
            return [courseId,matches[0].sha];
          }));
          const summary={appSha:process.env.GITHUB_SHA,counts:{sources:5},sourceShas,code:'VERIFICATION_PASSED'};
          const bytes=JSON.stringify(summary)+'\n';
          if(!/^[a-f0-9]{40}$/.test(summary.appSha)||Buffer.byteLength(bytes)>1048576)throw Error('CI_SUMMARY_REJECTED');
          await writeFile('.reports/ci-summary.json',bytes,{flag:'wx'});
          NODE
      - name: Upload safe metadata only
        id: summary-upload
        if: ${{ steps.skip-public-deployment.outputs.skip != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ github.run_attempt == 1 && 'verify-metadata' || format('verify-metadata-{0}', github.run_attempt) }}
          path: app/.reports/ci-summary.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - name: Publish the verified bundle to the public Worker
        id: publish
        if: >-
          ${{ vars.STUDY_HUB_AUTOMATIC_UPDATES == 'enabled' && inputs.mode != 'verify' &&
              steps.skip-public-deployment.outputs.skip != 'true' }}
        env:
          STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS: ${{ vars.STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          COURSE_RELEASE: ${{ steps.compare-public-inputs.outcome == 'success' && steps.compare-public-inputs.outputs.course_release || '' }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import { lstat, writeFile } from 'node:fs/promises';
          import { validatePublicSettings } from './tools/deploy/worker-target.ts';
          try {
            const text = process.env.STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS;
            if (!text || Buffer.byteLength(text) > 4096) throw Error();
            const settings = JSON.parse(text);
            validatePublicSettings(settings);
            if (!(await lstat('.local')).isDirectory()) throw Error();
            await writeFile('.local/public-deployment.json', JSON.stringify(settings), {flag:'wx',mode:0o600});
          } catch {
            console.error('CI_PUBLIC_DEPLOYMENT_CONFIGURATION_REJECTED');
            process.exitCode = 1;
          }
          NODE
          if [ -e .reports/public-release.json ] || [ -L .reports/public-release.json ]; then
            echo CI_PUBLICATION_RECEIPT_ALREADY_EXISTS
            exit 1
          fi
          publication_status=0
          node --import tsx tools/deploy/public-release.ts --automatic > /dev/null 2>&1 || publication_status=$?
          if [ "$publication_status" -eq 75 ]; then echo CI_COURSE_BASELINE_CHANGED_BEFORE_UPLOAD; exit 1; fi
          node --input-type=module <<'NODE'
          import { lstat, readFile, appendFile } from 'node:fs/promises';
          try {
            const path = '.reports/public-release.json';
            const stat = await lstat(path);
            if (!stat.isFile() || stat.size > 4096) throw Error();
            const text = await readFile(path, 'utf8');
            if (Buffer.byteLength(text) > 4096) throw Error();
            const receipt = JSON.parse(text);
            const statuses = ['upload-started-outcome-unknown', 'uploaded-postcheck-pending', 'published-public-verified'];
            if (!statuses.includes(receipt.status)) throw Error();
            const sha256 = /^[a-f0-9]{64}$/;
            const safe = { status: receipt.status };
            for (const key of ['versionId', 'currentVersionId', 'previousVersionId', 'deploymentId']) {
              if (receipt[key] === undefined) continue;
              if (typeof receipt[key] !== 'string' || !/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(receipt[key]))
                throw Error();
              safe[key] = receipt[key];
            }
            if (!safe.previousVersionId || typeof receipt.bundleHash !== 'string' || !sha256.test(receipt.bundleHash))
              throw Error();
            safe.bundleHash = receipt.bundleHash;
            if (receipt.status === 'published-public-verified') {
              if (!safe.deploymentId || !safe.versionId || safe.currentVersionId !== safe.versionId ||
                  !Number.isSafeInteger(receipt.checked) || receipt.checked < 3 || receipt.checked > 20000 ||
                  typeof receipt.catalogHash !== 'string' || !sha256.test(receipt.catalogHash)) throw Error();
              safe.checked = receipt.checked;
              safe.catalogHash = receipt.catalogHash;
            }
            const summary = 'Public deployment outcome\n\n```json\n' + JSON.stringify(safe) + '\n```\n';
            await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(JSON.stringify(safe));
          } catch {
            console.error('CI_PUBLICATION_RECEIPT_UNAVAILABLE_INSPECT_CURRENT_TARGET');
            process.exitCode = 1;
          }
          NODE
          if [ "$publication_status" -ne 0 ]; then echo CI_AUTOMATIC_PUBLICATION_FAILED_INSPECT_CURRENT_TARGET; exit 1; fi
          printf 'published_at=%s\n' "$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Record the verified public deployment checkpoint
        id: record-public-checkpoint
        if: >-
          ${{ steps.publish.outcome == 'success' && steps.fingerprint-public-inputs.outcome == 'success' &&
              steps.fingerprint-public-inputs.outputs.input_hash != '' }}
        continue-on-error: true
        env:
          STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS: ${{ vars.STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS }}
          EXPECTED_PUBLIC_INPUT_HASH: ${{ steps.fingerprint-public-inputs.outputs.input_hash }}
          COURSE_RELEASE: ${{ steps.compare-public-inputs.outcome == 'success' && steps.compare-public-inputs.outputs.course_release || '' }}
          DOCUMENT_TRANSFORM_REUSE: ${{ vars.STUDY_HUB_DOCUMENT_TRANSFORM_REUSE }}
        run: node --import tsx tools/ci/public-deployment-checkpoint.ts record
      - name: Upload the public deployment checkpoint
        id: upload-public-checkpoint
        if: ${{ steps.record-public-checkpoint.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-checkpoint-${{ github.run_attempt }}
          path: app/.reports/public-checkpoint.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - name: Upload verified document transform metadata
        if: ${{ steps.upload-public-checkpoint.outcome == 'success' && steps.record-public-checkpoint.outputs.transform_index_saved == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: document-transform-index-${{ github.run_attempt }}
          path: app/.reports/document-transform-index.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - name: Confirm the public deployment checkpoint was saved
        if: ${{ steps.upload-public-checkpoint.outcome == 'success' }}
        run: echo CI_PUBLIC_CHECKPOINT_SAVED
      - name: Report unavailable public deployment checkpoint
        if: >-
          ${{ steps.record-public-checkpoint.outcome == 'failure' || steps.upload-public-checkpoint.outcome == 'failure' }}
        run: echo '::warning::CI_PUBLIC_CHECKPOINT_NOT_SAVED'
      - name: Measure browser verification for changed courses
        id: observe-course-verification
        if: >-
          ${{ vars.STUDY_HUB_COURSE_VERIFICATION == 'observe' && steps.publish.outcome == 'success' &&
              steps.compare-public-inputs.outcome == 'success' && steps.compare-public-inputs.outputs.changed_courses != '' }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          CHANGED_COURSES: ${{ steps.compare-public-inputs.outputs.changed_courses }}
        run: |
          node tools/ci/process-boundary.ts probe-processes "$RUNNER_TEMP/study-hub-trusted.json"
          result=0
          timeout --kill-after=15s 10m node --import tsx tools/ci/observe-course-verification.ts .local/ci-sources.json "$CHANGED_COURSES" || result=$?
          node tools/ci/process-boundary.ts check "$RUNNER_TEMP/study-hub-trusted.json"
          if [ "$result" -ne 0 ]; then echo '::warning::CI_COURSE_COMPARISON_UNAVAILABLE'; exit 1; fi
      - name: Check the process boundary before the document transform observation
        id: transform-observe-boundary
        if: >-
          ${{ vars.STUDY_HUB_DOCUMENT_TRANSFORM_REUSE == 'observe' && steps.publish.outcome == 'success' &&
              steps.compare-public-inputs.outcome == 'success' && steps.compare-public-inputs.outputs.transform_base != '' }}
        continue-on-error: true
        run: |
          printf 'started_at=%s\n' "$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          node tools/ci/process-boundary.ts check "$RUNNER_TEMP/study-hub-trusted.json"
      - name: Read the previous verified document transform index
        id: transform-observe-index
        if: ${{ steps.transform-observe-boundary.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENT_TRANSFORM_BASELINE: ${{ steps.compare-public-inputs.outputs.transform_base }}
        run: node --import tsx tools/ci/observe-document-transforms.ts prepare
      - name: Compare an isolated document reuse build with the published bundle
        id: observe-document-transforms
        if: ${{ steps.transform-observe-index.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          DOCUMENT_TRANSFORM_BASELINE: ${{ steps.compare-public-inputs.outputs.transform_base }}
          STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS: ${{ vars.STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS }}
          INDEX_FETCH_MS: ${{ steps.transform-observe-index.outputs.index_fetch_ms }}
          DISPATCH_AT: ${{ steps.transform-observe-index.outputs.dispatch_at }}
          JOB_STARTED_AT: ${{ steps.transform-observe-index.outputs.job_started_at }}
          BASELINE_BUILD_STARTED_AT: ${{ steps.material.outputs.build_started_at }}
          BASELINE_BUILD_FINISHED_AT: ${{ steps.material.outputs.build_finished_at }}
          PUBLISHED_AT: ${{ steps.publish.outputs.published_at }}
        run: |
          result=0
          timeout --kill-after=10s 150s node --import tsx tools/ci/observe-document-transforms.ts observe || result=$?
          node tools/ci/process-boundary.ts check "$RUNNER_TEMP/study-hub-trusted.json"
          exit "$result"
      - name: Report document transform observation overhead
        if: >-
          ${{ vars.STUDY_HUB_DOCUMENT_TRANSFORM_REUSE == 'observe' && steps.publish.outcome == 'success' &&
              github.event_name == 'workflow_dispatch' && inputs.source_repository != '' }}
        env:
          OBSERVATION_STARTED_AT: ${{ steps.transform-observe-boundary.outputs.started_at }}
          OBSERVATION_OUTCOME: ${{ steps.observe-document-transforms.outcome }}
        run: |
          if [[ "$OBSERVATION_STARTED_AT" =~ ^[0-9]{13}$ ]]; then
            observation_ms=$(($(date +%s%3N) - OBSERVATION_STARTED_AT))
            printf 'Document HTML/CSS observation overhead (ms) %s\n' "$observation_ms" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$OBSERVATION_OUTCOME" != success ]]; then
            echo 'Document HTML/CSS reuse (observe) · unavailable' >> "$GITHUB_STEP_SUMMARY"
            echo '::warning::CI_DOCUMENT_TRANSFORM_OBSERVATION_UNAVAILABLE'
          fi
