name: Verify pinned study updates
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Verification only; deployment is not enabled
        type: choice
        options: [verify]
        default: verify
      source_repository:
        description: Optional source repository notification
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: study-hub-production
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'jjundev/ajou-study-hub' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'jjundev/ajou-study-hub/.github/workflows/study-hub-update.yml@refs/heads/main' &&
      github.workflow_sha == github.sha &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Validate dispatch before privileged work
        id: guard
        working-directory: ${{ github.workspace }}
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
        run: |
          node <<'NODE'
          const allowed=['','jjundev/ajou-nonhoesil','jjundev/ajou-life-science','jjundev/ajou-electronic-circuits-2','jjundev/ajou-jagual','jjundev/ajou-ml-basics'];
          if(!['','verify'].includes(process.env.MODE??'')||!allowed.includes(process.env.SOURCE_REPOSITORY??'')){console.error('CI_INPUT_REJECTED');process.exitCode=1;}
          NODE
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Checkout trusted app SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-study-hub
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - name: Prepare isolated Git configuration before Reader or source checkout
        id: source-git
        run: node tools/ci/source-git-environment.ts
      - name: Record trusted checkout before executing dependencies
        run: node tools/ci/process-boundary.ts capture "$RUNNER_TEMP/study-hub-trusted.json"
      - name: Load pinned resolver without lifecycle scripts or Reader credentials
        run: npm ci --ignore-scripts --no-audit --no-fund > /dev/null 2>&1 || { echo CI_RESOLVER_INSTALL_FAILED; exit 1; }
      - name: Derive exact sparse selections from trusted course configuration
        id: sparse
        run: node --import tsx tools/ci/sparse-source.ts
      - name: Prove sparse Git selection with synthetic local repositories before Reader
        id: sparse-probe
        run: npx vitest run tests/ci/sparse-source.test.ts tests/ci/source-limits.test.ts tests/ci/source-git-environment.test.ts --maxWorkers=1 > /dev/null 2>&1 || { echo CI_SPARSE_PROBE_FAILED; exit 1; }
      - name: Create source-only Reader token
        id: reader
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.STUDY_HUB_READER_APP_ID }}
          private-key: ${{ secrets.STUDY_HUB_READER_PRIVATE_KEY }}
          owner: jjundev
          repositories: ajou-nonhoesil,ajou-life-science,ajou-electronic-circuits-2,ajou-jagual,ajou-ml-basics
          permission-contents: read
      - name: Resolve all five main revisions once
        id: revisions
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          mkdir -p .local
          node --import tsx tools/ci/sources-cli.ts resolve > .local/revisions.json
          node --input-type=module <<'NODE'
          import {readFile,writeFile,appendFile} from 'node:fs/promises';
          const revisions=JSON.parse(await readFile('.local/revisions.json','utf8'));
          for(const revision of revisions){revision.root='../sources/'+revision.courseId;await appendFile(process.env.GITHUB_OUTPUT,revision.courseId.replaceAll('-','_')+'='+revision.sha+'\n');}
          await writeFile('.local/revisions.json',JSON.stringify(revisions));
          NODE
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-nonhoesil
          ref: ${{ steps.revisions.outputs.logic_lab }}
          token: ${{ steps.reader.outputs.token }}
          path: sources/logic-lab
          sparse-checkout: ${{ steps.sparse.outputs.logic_lab }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-life-science
          ref: ${{ steps.revisions.outputs.life_science }}
          token: ${{ steps.reader.outputs.token }}
          path: sources/life-science
          sparse-checkout: ${{ steps.sparse.outputs.life_science }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-electronic-circuits-2
          ref: ${{ steps.revisions.outputs.circuits_2 }}
          token: ${{ steps.reader.outputs.token }}
          path: sources/circuits-2
          sparse-checkout: ${{ steps.sparse.outputs.circuits_2 }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-jagual
          ref: ${{ steps.revisions.outputs.data_structures }}
          token: ${{ steps.reader.outputs.token }}
          path: sources/data-structures
          sparse-checkout: ${{ steps.sparse.outputs.data_structures }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-ml-basics
          ref: ${{ steps.revisions.outputs.ml_basics }}
          token: ${{ steps.reader.outputs.token }}
          path: sources/ml-basics
          sparse-checkout: ${{ steps.sparse.outputs.ml_basics }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
      - name: Revoke Reader before any browser or material execution
        id: revoke-reader
        if: ${{ always() && steps.reader.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          node <<'NODE'
          (async()=>{
            const response=await fetch('https://api.github.com/installation/token',{method:'DELETE',redirect:'error',signal:AbortSignal.timeout(30000),headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            if(response.status!==204||response.redirected)throw Error();
          })().catch(()=>{console.error('CI_READER_REVOCATION_FAILED');process.exitCode=1;});
          NODE
      - name: Bound source paths, sizes, and free space before material reads
        id: source-limits
        run: |
          node --import tsx tools/ci/source-limits.ts
          node --import tsx tools/ci/sources-cli.ts bind "$GITHUB_SHA" .local/revisions.json > /dev/null || { echo CI_BIND_FAILED; exit 1; }
      - name: Install trusted application dependencies
        run: npm ci --no-audit --no-fund > /dev/null 2>&1 || { echo CI_INSTALL_FAILED; exit 1; }
      - name: Install three browsers
        id: browsers
        run: npx playwright install --with-deps chromium firefox webkit > /dev/null 2>&1 || { echo CI_BROWSER_INSTALL_FAILED; exit 1; }
      - name: Typecheck and synthetic tests
        run: |
          npm run typecheck > /dev/null 2>&1 || { echo CI_TYPECHECK_FAILED; exit 1; }
          npm test -- --maxWorkers=1 > /dev/null 2>&1 || { echo CI_UNIT_FAILED; exit 1; }
          # Default app commands generate synthetic fixtures; no --sources or cloud credentials here.
          npm run test:e2e -- --reporter=line || { echo CI_E2E_FAILED; exit 1; }
      - name: Build and verify the same pinned material checkout
        run: |
          npm run build -- --sources .local/ci-sources.json > /dev/null 2>&1 || { echo CI_BUILD_FAILED; exit 1; }
          npm run verify:content -- --sources .local/ci-sources.json > /dev/null 2>&1 || { echo CI_CONTENT_FAILED; exit 1; }
      - name: Detect surviving processes and trusted checkout changes
        id: boundary
        run: |
          npm run ci:boundary -- check "$RUNNER_TEMP/study-hub-trusted.json"
          node --input-type=module <<'NODE'
          import {readdir,realpath} from 'node:fs/promises';
          import {resolve} from 'node:path';
          import {credentialConfigurationFingerprint} from './tools/ci/process-boundary.ts';
          try {
            for(const entry of await readdir('../sources',{withFileTypes:true})){
              const path=resolve('../sources',entry.name);
              if(!entry.isDirectory()||entry.isSymbolicLink()||await realpath(path)!==path)throw Error();
              await credentialConfigurationFingerprint(path);
            }
          } catch {console.error('BOUNDARY_SOURCE_CREDENTIAL_CONFIG');process.exitCode=1;}
          NODE
      - name: Emit bounded metadata only
        run: |
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const summary={appSha:process.env.GITHUB_SHA,counts:{sources:5},code:'VERIFY_ONLY_DETECTION_PASSED'};
          const bytes=JSON.stringify(summary)+'\n';
          if(!/^[a-f0-9]{40}$/.test(summary.appSha)||Buffer.byteLength(bytes)>1048576)throw Error('CI_SUMMARY_REJECTED');
          await writeFile('ci-summary.json',bytes,{flag:'wx'});
          NODE
      - name: Upload safe metadata only
        id: summary-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verify-metadata
          path: app/ci-summary.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
