name: Verify and publish one study course
on:
  workflow_call:
    inputs:
      course_id:
        required: true
        type: string
      verify_only:
        required: true
        type: boolean
    secrets:
      STUDY_HUB_READER_APP_ID:
        required: true
      STUDY_HUB_READER_PRIVATE_KEY:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_READ_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
  deployments: write
jobs:
  course:
    if: >-
      github.repository == 'jjundev/ajou-study-hub' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == 'jjundev/ajou-study-hub/.github/workflows/study-hub-update.yml@refs/heads/main' &&
      github.workflow_sha == github.sha
    concurrency:
      group: study-hub-course-${{ inputs.course_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      COURSE_ID: ${{ inputs.course_id }}
      STUDY_HUB_STATIC_WORKER_PROFILE: ${{ vars.STUDY_HUB_STATIC_WORKER_PROFILE }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: jjundev/ajou-study-hub
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
          set-safe-directory: false
      - run: node tools/ci/source-git-environment.ts
      - run: node tools/ci/process-boundary.ts capture "$RUNNER_TEMP/study-hub-trusted.json"
      - run: node tools/ci/process-boundary.ts probe-processes "$RUNNER_TEMP/study-hub-trusted.json"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select the fixed course
        id: selection
        run: node --import tsx tools/ci/select-course-source.ts selection
      - name: Create the Reader for this repository
        id: reader
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.STUDY_HUB_READER_APP_ID }}
          private-key: ${{ secrets.STUDY_HUB_READER_PRIVATE_KEY }}
          owner: jjundev
          repositories: ${{ steps.selection.outputs.repository_name }}
          permission-contents: read
      - name: Pin the course main revision
        id: revision
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          mkdir -p .local
          node --import tsx tools/ci/sources-cli.ts resolve --course "$COURSE_ID" > .local/revisions.json
          node --import tsx tools/ci/select-course-source.ts revision
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ steps.selection.outputs.repository }}
          ref: ${{ steps.revision.outputs.sha }}
          path: sources/${{ inputs.course_id }}
          token: ${{ steps.reader.outputs.token }}
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
          sparse-checkout: ${{ steps.selection.outputs.sparse }}
          sparse-checkout-cone-mode: false
          lfs: false
          submodules: false
      - name: Hydrate tracked status
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: node --import tsx tools/ci/hydrate-source-status.ts "$COURSE_ID"
      - name: Revoke the Reader
        id: revoke-reader
        if: ${{ always() && steps.reader.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          node --input-type=module <<'NODE'
          try {
            const response = await fetch('https://api.github.com/installation/token', {
              method: 'DELETE', redirect: 'error', signal: AbortSignal.timeout(30_000),
              headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' },
            });
            if (response.status !== 204) throw Error();
          } catch { console.error('CI_READER_REVOCATION_FAILED'); process.exitCode = 1; }
          NODE
      - name: Bind and validate the single checkout
        run: |
          node --import tsx tools/ci/source-limits.ts "$COURSE_ID"
          node --import tsx tools/ci/sources-cli.ts bind "$GITHUB_SHA" .local/revisions.json --course "$COURSE_ID" >/dev/null
      - run: npm ci --no-audit --no-fund
      - name: Build the approved static course assets
        run: node --import tsx tools/ci/course-build.ts "$COURSE_ID"
      - name: Install the verification browsers
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify the selected course in browsers
        id: verify-course
        run: node --import tsx tools/ci/verify-course-worker.ts "$COURSE_ID"
      - name: Check process and source credential boundaries
        run: |
          node tools/ci/process-boundary.ts check "$RUNNER_TEMP/study-hub-trusted.json"
          node --input-type=module -e "import {credentialConfigurationFingerprint as check} from './tools/ci/process-boundary.ts'; await check('../sources/' + process.env.COURSE_ID)"
      - name: Load a previous verified checkpoint
        if: ${{ vars.STUDY_HUB_AUTOMATIC_UPDATES == 'enabled' && !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE_BASELINES: ${{ vars.STUDY_HUB_COURSE_WORKER_BASELINES }}
        run: node --import tsx tools/ci/course-worker-checkpoint.ts load
      - name: Publish only the selected internal Worker
        id: publish-course
        if: ${{ vars.STUDY_HUB_AUTOMATIC_UPDATES == 'enabled' && !inputs.verify_only }}
        env:
          STUDY_HUB_AUTOMATIC_UPDATES: ${{ vars.STUDY_HUB_AUTOMATIC_UPDATES }}
          STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS: ${{ vars.STUDY_HUB_PUBLIC_DEPLOYMENT_SETTINGS }}
          STUDY_HUB_COURSE_WORKER_SETTINGS: ${{ vars.STUDY_HUB_COURSE_WORKER_SETTINGS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
        run: node --import tsx tools/deploy/course-worker-release.ts "$COURSE_ID"
      - name: Record the verified version in GitHub deployment history
        if: ${{ steps.publish-course.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx tools/ci/course-worker-checkpoint.ts save
      - name: Save verified course checkpoint
        if: ${{ always() && steps.publish-course.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: course-checkpoint-${{ inputs.course_id }}-${{ github.run_attempt }}
          path: app/.reports/course-worker/${{ inputs.course_id }}/checkpoint.json
          retention-days: 90
          if-no-files-found: error
      - name: Save course verification and any publish receipt
        if: ${{ always() && steps.verify-course.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: course-verification-${{ inputs.course_id }}-${{ github.run_attempt }}
          path: |
            app/.reports/course-worker/${{ inputs.course_id }}/verification.json
            app/.reports/course-worker/${{ inputs.course_id }}/publish-receipt.json
          retention-days: 14
